# Build, check, and deploy the site to Firebase Hosting.
#
# - Pull requests: lint, type check, and build (no deploy), so broken code
#   is caught before it reaches main.
# - Push / merge to main: the same checks, then deploy to the live site.
#
# Login to Google Cloud uses Workload Identity Federation (no key file):
# Google Cloud trusts GitHub Actions runs from this repository's main branch
# and lets them act as the deploy service account for a short time.
#
# One-time setup in GitHub (Settings > Secrets and variables > Actions > Variables).
# None of these are secrets:
#   GCP_WORKLOAD_IDENTITY_PROVIDER  projects/<number>/locations/global/workloadIdentityPools/github/providers/my-resume
#   GCP_SERVICE_ACCOUNT             github-deploy-german-resume@german-resume.iam.gserviceaccount.com
#   FIREBASE_PROJECT_ID             german-resume
# See README.md, "Automatic deploys".

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: read

# Never run two deploys at the same time; a newer push cancels an older run.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      # Build first: it generates the route types that the type check needs.
      - run: npm run build
      - run: npm run typecheck

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 7

  deploy:
    name: Deploy to Firebase Hosting
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets this job ask GitHub for a login token for Google Cloud
    environment:
      name: production
      url: https://germanresume.com
    steps:
      - uses: actions/checkout@v4

      # Deploy exactly the files that passed the checks.
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Log in to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting (live)
        run: npx --yes firebase-tools@latest deploy --only hosting --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
